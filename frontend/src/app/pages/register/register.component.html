<section class="flex min-h-screen items-center justify-center bg-gray-50 px-6 py-16">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
    <h1 class="text-center text-3xl font-bold text-gray-900">
      Create Account
    </h1>

    <p id="registration-description" class="mt-2 text-center text-gray-600">
      Register for Austin Surface Pros.
    </p>

    <form
      class="mt-8 space-y-5"
      aria-describedby="registration-description"
      (submit)="$event.preventDefault()"
    >
      <div>
        <label for="registration-name" class="font-semibold text-gray-900">
          Full name
        </label>
        <input
          id="registration-name"
          name="name"
          type="text"
          autocomplete="name"
          required
          class="mt-2 w-full rounded-lg border border-gray-500 px-4 py-3"
        >
      </div>

      <div>
        <label for="registration-email" class="font-semibold text-gray-900">
          Email
        </label>
        <input
          id="registration-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="mt-2 w-full rounded-lg border border-gray-500 px-4 py-3"
        >
      </div>

      <div>
        <label for="registration-password" class="font-semibold text-gray-900">
          Password
        </label>
        <input
          id="registration-password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          class="mt-2 w-full rounded-lg border border-gray-500 px-4 py-3"
        >
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-700 py-3 font-semibold text-white transition hover:bg-blue-800"
      >
        Register
      </button>
    </form>
  </div>
</section>
