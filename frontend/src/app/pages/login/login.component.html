<section class="flex min-h-screen items-center justify-center bg-gray-50 px-6 py-16">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
    <h1 class="text-center text-3xl font-bold text-gray-900">
      Login
    </h1>

    <p id="login-description" class="mt-2 text-center text-gray-600">
      Access your Austin Surface Pros account.
    </p>

    <form
      class="mt-8 space-y-5"
      aria-describedby="login-description"
      (submit)="$event.preventDefault()"
    >
      <div>
        <label for="login-email" class="font-semibold text-gray-900">
          Email
        </label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="username"
          required
          class="mt-2 w-full rounded-lg border border-gray-500 px-4 py-3"
        >
      </div>

      <div>
        <label for="login-password" class="font-semibold text-gray-900">
          Password
        </label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="mt-2 w-full rounded-lg border border-gray-500 px-4 py-3"
        >
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-700 py-3 font-semibold text-white transition hover:bg-blue-800"
      >
        Login
      </button>
    </form>
  </div>
</section>
