<div class="share-buttons" aria-label="Share this article">
  <span>Share</span>
  <button type="button" (click)="share()">
    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
    <span>Share…</span>
  </button>
  <a [href]="'https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
    <span>LinkedIn</span>
  </a>
  <a [href]="'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
    <span>Facebook</span>
  </a>
  <a [href]="emailHref">
    <i class="fa-solid fa-envelope" aria-hidden="true"></i>
    <span>Email</span>
  </a>
  <button type="button" (click)="copy()">
    <i class="fa-solid" [class.fa-check]="copied()" [class.fa-link]="!copied()" aria-hidden="true"></i>
    <span>{{ copied() ? 'Copied!' : 'Copy link' }}</span>
  </button>
</div>
