<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="450" cy="280" r="220"/>
    </clipPath>
  </defs>

  <!-- Badge circle -->
  <circle cx="450" cy="280" r="230" fill="#1C1C1C"/>
  <circle cx="450" cy="280" r="220" fill="#232323"/>

  <!-- Asphalt surface with perspective stripes -->
  <g clip-path="url(#circleClip)">
    <rect x="220" y="280" width="460" height="230" fill="#333333"/>
    <polygon points="390,510 418,510 458,300 448,300" fill="#F2A93B"/>
    <polygon points="482,510 510,510 472,300 462,300" fill="#F2A93B"/>
  </g>

  <!-- Trowel / striping tool icon above the horizon -->
  <g transform="translate(450,180)">
    <rect x="-72" y="-14" width="144" height="16" rx="3" fill="#F2A93B"/>
    <rect x="-6" y="2" width="12" height="48" fill="#D9D9D9"/>
    <rect x="-17" y="46" width="34" height="15" rx="3" fill="#9A9A9A"/>
  </g>

  <!-- Outer ring -->
  <circle cx="450" cy="280" r="220" fill="none" stroke="#F2A93B" stroke-width="7"/>

  <!-- Wordmark -->
  <text x="450" y="640" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" fill="#1C1C1C" text-anchor="middle" letter-spacing="1">
    AUSTIN SURFACE
  </text>
  <text x="450" y="720" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" fill="#F2A93B" text-anchor="middle" letter-spacing="6">
    PROS
  </text>

  <!-- Divider -->
  <rect x="325" y="760" width="250" height="4" fill="#1C1C1C"/>

  <!-- Tagline -->
  <text x="450" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="30" fill="#1C1C1C" text-anchor="middle" letter-spacing="4">
    CONCRETE &#8226; STONE &#8226; ASPHALT
  </text>
</svg>
