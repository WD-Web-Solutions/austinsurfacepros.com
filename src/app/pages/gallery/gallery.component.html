<!-- Gallery Hero -->

<section
  class="
    bg-gray-900
    py-24
  "
>

  <div
    class="
      mx-auto
      max-w-7xl
      px-6
      text-center
    "
  >

    <h1
      class="
        text-5xl
        font-bold
        text-white
        md:text-6xl
      "
    >
      Project Gallery
    </h1>


    <p
      class="
        mx-auto
        mt-6
        max-w-3xl
        text-xl
        text-gray-300
      "
    >
      View examples of our commercial asphalt,
      concrete, and surface improvement projects.
    </p>

  </div>

</section>



<!-- Gallery Grid -->

<section
  class="
    py-20
  "
>

<div
  class="
    mx-auto
    max-w-7xl
    px-6
  "
>


<div
  class="
    grid
    gap-8
    md:grid-cols-2
    lg:grid-cols-3
  "
>


@for(item of galleryItems; track item.id)
{

<div
  class="
    group
    overflow-hidden
    rounded-xl
    bg-white
    shadow-md
    transition
    hover:-translate-y-2
    hover:shadow-xl
  "
>


<div
  class="
    h-64
    overflow-hidden
  "
>


<img

[src]="item.image"

[alt]="item.title"

class="
h-full
w-full
object-cover
transition
duration-500
group-hover:scale-110
"

/>


</div>



<div
class="
p-6
"
>


<span
class="
text-sm
font-semibold
text-primary
"
>
{{ item.category }}
</span>



<h2
class="
mt-2
text-2xl
font-bold
text-dark
"
>
{{ item.title }}
</h2>



<p
class="
mt-3
text-muted
"
>
{{ item.description }}
</p>


</div>


</div>


}


</div>


</div>

</section>
