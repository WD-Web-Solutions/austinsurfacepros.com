<!-- HERO -->


<section

class="
bg-gray-900
py-24
"

>

<div

class="
mx-auto
max-w-7xl
px-6
"

>


<p

class="
text-sm
font-semibold
uppercase
tracking-widest
text-orange-400
"

>
Our Work
</p>



<h1

class="
mt-5
text-5xl
font-bold
text-white
"

>
Commercial Surface Projects
</h1>



<p

class="
mt-6
max-w-3xl
text-xl
text-gray-300
"

>
Explore examples of asphalt, striping, coatings,
and commercial improvement projects.
</p>



</div>

</section>







<!-- GALLERY GRID -->


<section

class="
py-20
"

>


<div

class="
mx-auto
grid
max-w-7xl
gap-8
px-6
md:grid-cols-2
lg:grid-cols-3
"

>



@for(item of galleryItems; track item.title)
{


<div

class="
overflow-hidden
rounded-xl
bg-white
shadow-lg
transition
duration-300
hover:-translate-y-2
hover:shadow-2xl
"

>


<img

[src]="item.image"

[alt]="item.title"

class="
h-64
w-full
object-cover
"

>




<div

class="
p-6
"

>


<p

class="
text-sm
font-semibold
text-blue-600
"

>
{{item.category}}
</p>



<h2

class="
mt-2
text-2xl
font-bold
text-gray-900
"

>
{{item.title}}
</h2>




<p

class="
mt-4
text-gray-600
"

>
{{item.description}}
</p>



</div>


</div>


}


</div>


</section>






<!-- CTA -->


<section

class="
bg-blue-600
py-20
"

>


<div

class="
mx-auto
max-w-5xl
px-6
text-center
"

>


<h2

class="
text-4xl
font-bold
text-white
"

>
Have a Project in Mind?
</h2>



<a

routerLink="/contact"

class="
mt-8
inline-block
rounded-lg
bg-white
px-8
py-4
font-semibold
text-blue-600
transition
duration-300
hover:-translate-y-1
hover:shadow-xl
"

>
Request Estimate
</a>


</div>


</section>
